schema_version: "1.1"
name: release-block-shape
expected_outcome: |
  The agent writes the release block for tidy-csv 0.3.0 and the notes file it uses. The tag line uses the full
  40-character merge hash 4f2c9e1a7b3d5f8e0c6a9b2d4e7f1a3c5b8d0e2f. The block runs git push origin v0.3.0 before
  gh release create, and gh release create has --verify-tag. The notes file holds the 0.3.0 section with each
  paragraph and each bullet on one line, because GitHub release pages turn every newline into a hard break. The
  block has a gh repo edit line with --description and --add-topic, because the About box is empty. gh release
  create attaches dist/tidy-csv-0.3.0.zip. No line holds a placeholder. Every single-quoted string holds no
  double quote, no $, no backtick and no backslash, any apostrophe is doubled, and nothing mentions AI. The block is written for Windows PowerShell 5.1.
  It chains no commands with && or ||, continues no line with a trailing backslash, and puts the tag message, the
  release title and the About description in single quotes. No seat is dispatched and no code is edited.
context:
  scaffold_script: place-files.sh
