  the most capable model. Task 8 touches no security trigger, so the security seat is skipped and the ledger gives
  that reason. Task 9 fixes a typo in a docstring. It touches no critical area, the decision records that, and its
  code-quality seat runs on the mid tier. The overseer runs on the most capable model for both tasks. No seat is
