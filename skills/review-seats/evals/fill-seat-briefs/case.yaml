schema_version: "1.1"
name: fill-seat-briefs
expected_outcome: |
  The workspace holds a filled-in round-1 brief for each of the three seats. The overseer's brief names the
  "Head of Data Quality" persona, and its critical-areas line reads none, because the project's CLAUDE.md lists
  no critical areas. The code-quality brief calls the ponytail-review and ponytail skills by name.
  The security brief covers the task, because it writes a file and changes a doc. Each brief names the contract
  and the task-4 package by path, without pasting their text, and keeps only its round-1 mode with no
  placeholder left outside an HTML comment. The security brief gives INTERNAL/private_terms.txt as the
  term-list path and never quotes a term from it. Its ship-list line points to task-4-ship-list.md, and its
  audit-log line reads none with that reason, because cli.py needs arguments and the gate never ran it. The
  drafted commit message for task 4 is saved as its own file in the workspace. No seat runs.
context:
  scaffold_script: place-files.sh
